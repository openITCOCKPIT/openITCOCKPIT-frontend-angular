<ng-container *transloco="let t">
    <nav aria-label="breadcrumb" class="mt-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a [routerLink]="['/']">
                    <fa-icon [icon]="['fas', 'home']"></fa-icon>
                    {{ t('Home') }}
                </a></li>
            <li class="breadcrumb-item">
                <a *oitcPermission="['AutoreportModule', 'autoreports', 'index']" [routerLink]="['/', 'autoreport_module', 'autoreports', 'index']">
                    <fa-icon [icon]="['fas', 'puzzle-piece']"></fa-icon>
                    {{ t('Autoreport Module') }}
                </a>
            </li>
            <li aria-current="page" class="breadcrumb-item active">
                <fa-icon [icon]="['fas', 'envelope']"></fa-icon>
                {{ t('Mail log') }}
            </li>
        </ol>
    </nav>
    <c-card class="mb-3">
        <c-card-header>
            @if (mailLog) {
                <h5 cCardTitle>
                    {{ t('Mail log') }}
                    <small class="fw-300">
                        {{ t('Autoreport') }}: {{ mailLog.autoreport.name }}
                    </small>
                </h5>
            }
            <c-nav class="card-toolbar card-header-pills">
                <c-nav-item class="px-1">
                    <button (click)="load()" cButton class="ripple" color="default" size="xs">
                        <fa-icon [icon]="['fas', 'arrows-rotate']"></fa-icon>
                        {{ t('Refresh') }}
                    </button>
                </c-nav-item>
                <c-nav-item class="px-1">
                    <button [fallbackUrl]="['autoreport_module', 'autoreports', 'index']" cButton class="ripple"
                            color="default"
                            oitcBackButton
                            size="xs">
                        <fa-icon [icon]="['fas', 'left-long']"></fa-icon>
                        {{ t('Back') }}
                    </button>
                </c-nav-item>
                <c-nav-item class="px-1">
                    <button (click)="toggleFilter()" cButton class="ripple" color="primary" size="xs">
                        <fa-icon [icon]="['fas', 'filter']"></fa-icon>
                        {{ t('Filter') }}
                    </button>
                </c-nav-item>
            </c-nav>
        </c-card-header>
        <c-card-body>
            @if (!mailLog) {
                <oitc-table-loader></oitc-table-loader>
            }
            <!-- Filter -->
            <c-container [hidden]="hideFilter" class="shadow-sm p-2 mb-4 bg-body rounded" [fluid]="true">
                <c-row>
                    <c-col>
                        <h6 class="pb-2 mb-3 border-bottom">
                            <fa-icon [icon]="['fas', 'filter']"></fa-icon>
                            {{ t('Filter') }}
                        </h6>
                    </c-col>
                </c-row>
                <form cForm>
                    <c-row>
                        <c-col md="6" class="mb-2">
                            <c-input-group>
                                <span cInputGroupText>
                                    {{ t('From') }}
                                </span>
                                <input (debouncedValue)="onFilterChange($event)"
                                       [(ngModel)]="from"
                                       [placeholder]="'From date' | transloco"
                                       aria-label="from"
                                       name="from"
                                       cFormControl
                                       oitcDebounce
                                       type="datetime-local"
                                />
                            </c-input-group>
                        </c-col>
                        <c-col md="6" class="mb-2">
                            <c-input-group>
                                <span cInputGroupText>
                                    {{ t('To') }}
                                </span>
                                <input (debouncedValue)="onFilterChange($event)"
                                       [(ngModel)]="to"
                                       [placeholder]="'To date' | transloco"
                                       aria-label="to"
                                       name="to"
                                       cFormControl
                                       oitcDebounce
                                       type="datetime-local"
                                />
                            </c-input-group>
                        </c-col>
                        <c-col md="6" class="mb-2">
                            <c-input-group>
                                <span cInputGroupText>
                                    <fa-icon [icon]="['fas', 'user']" class="px-2"></fa-icon>
                                </span>
                                <input (debouncedValue)="onFilterChange($event)"
                                       [(ngModel)]="params['filter[ReportMailLog.recipients]']"
                                       [placeholder]="'Filter by recipient' | transloco"
                                       aria-label="MailLogRecipient"
                                       cFormControl
                                       name="MailLogRecipient"
                                       oitcDebounce
                                       type="text"
                                />
                            </c-input-group>
                        </c-col>
                    </c-row>
                    <c-row class="my-2">
                        <c-col md="6">
                            <fieldset>
                                <h5>
                                    {{ t('Has been sent') }}
                                </h5>
                                <c-form-check>
                                    <input (debouncedValue)="onFilterChange($event)"
                                           [(ngModel)]="hasBeenSentFilter.sent"
                                           cFormCheckInput
                                           id="MailLogSent"
                                           name="MailLogSent"
                                           class="checkbox-lg checkbox-success"
                                           oitcDebounce
                                           type="checkbox"/>
                                    <label cFormCheckLabel class="ms-1 mt-1" for="MailLogSent">
                                        {{ t('Sent') }}
                                    </label>
                                </c-form-check>
                                <c-form-check>
                                    <input (debouncedValue)="onFilterChange($event)"
                                           [(ngModel)]="hasBeenSentFilter.failed"
                                           cFormCheckInput
                                           id="MailLogFailed"
                                           name="MailLogFailed"
                                           class="checkbox-lg checkbox-danger"
                                           oitcDebounce
                                           type="checkbox"/>
                                    <label cFormCheckLabel class="ms-1 mt-1" for="MailLogFailed">
                                        {{ t('Failed') }}
                                    </label>
                                </c-form-check>
                            </fieldset>
                        </c-col>
                    </c-row>

                    <c-row class="mt-2">
                        <c-col class="text-end">
                            <button (click)="resetFilter()" cButton class="ripple" color="danger" size="xs">
                                {{ t('Reset filter') }}
                            </button>
                        </c-col>
                    </c-row>
                </form>
            </c-container>
            <!-- End Filter -->
            @if (mailLog) {
                <oitc-report-mail-log-table
                    [mailLog]="mailLog.mailLog"
                    [sort]="params.sort"
                    [direction]="params.direction"
                    (sortChange)="onSortChange($event)">
                </oitc-report-mail-log-table>
            }
            <c-container [fluid]="true">
                <c-row>
                    <c-col>
                        @if (mailLog) {
                            <oitc-paginate-or-scroll
                                (paginatorChange)="onPaginatorChange($event)"
                                [paginateOrScroll]="mailLog"></oitc-paginate-or-scroll>
                        }
                    </c-col>
                </c-row>
            </c-container>
        </c-card-body>
    </c-card>
</ng-container>
