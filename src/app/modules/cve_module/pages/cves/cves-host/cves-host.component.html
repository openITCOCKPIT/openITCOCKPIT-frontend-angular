<ng-container *transloco="let t">
    <nav aria-label="breadcrumb" class="mt-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a [routerLink]="['/']">
                    <fa-icon [icon]="['fas', 'home']"></fa-icon>
                    {{ t('Home') }}
                </a>
            </li>
            <li class="breadcrumb-item">
                <a [routerLink]="['/', 'cve_module', 'cves', 'index']">
                    <fa-icon [icon]="['fas', 'shield-virus']"></fa-icon>
                    {{ t('Vulnerabilities') }}
                </a>
            </li>
            <li aria-current="page" class="breadcrumb-item active">
                <fa-icon [icon]="['fas', 'server']"></fa-icon>
                {{ t('Host') }}
            </li>
        </ol>
    </nav>
    <c-card class="mb-3">
        <c-card-header>
            <h5 cCardTitle>{{ t('Vulnerabilities') }}
                <small class="fw-300">
                    {{ t('Host') }}
                </small>
            </h5>
            <oitc-cves-pages-nav></oitc-cves-pages-nav>
        </c-card-header>
        <c-card-body>
            <oitc-cves-host-details [hostId]="hostId"></oitc-cves-host-details>
        </c-card-body>
    </c-card>
</ng-container>
